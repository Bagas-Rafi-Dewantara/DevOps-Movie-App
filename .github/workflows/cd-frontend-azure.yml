name: CD - Frontend Production (Azure)

on:
  push:
    branches: [master]
    paths-ignore:
      - "server/**" # Hanya trigger jika ada perubahan DI LUAR folder server
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: "pso-fp-movieapp12"
  ACR_REGISTRY: "movieappacr.azurecr.io"
  ACR_IMAGE_TAG: "latest"

jobs:
  # JOB 1: Validation
  validate-prerequisites:
    name: Validate Prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Environment Variables
        run: |
          if [ -z "${{ secrets.ACR_USERNAME }}" ]; then
            echo "❌ Error: ACR_USERNAME secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.ACR_PASSWORD }}" ]; then
            echo "❌ Error: ACR_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "❌ Error: AZURE_WEBAPP_PUBLISH_PROFILE secret is not set"
            exit 1
          fi
          echo "✅ All prerequisites validated successfully"

      - name: Check Frontend Files
        run: |
          if [ ! -f "package.json" ]; then
            echo "❌ Error: package.json not found in root"
            exit 1
          fi
          if [ ! -f "Dockerfile" ]; then
            echo "❌ Error: Dockerfile not found in root"
            exit 1
          fi
          echo "✅ Frontend files validated"

  # JOB 2: Build, Push & Deploy
  build-push-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: validate-prerequisites
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to ACR (Frontend)
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image (Frontend)
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_KEY=${{ secrets.NEXT_PUBLIC_API_KEY }} \
            --build-arg NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }} \
            --build-arg NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} \
            --build-arg NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL }} \
            --build-arg GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --build-arg GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
            -t ${{ env.ACR_REGISTRY }}/${{ env.AZURE_WEBAPP_NAME }}:${{ env.ACR_IMAGE_TAG }} \
            -t ${{ env.ACR_REGISTRY }}/${{ env.AZURE_WEBAPP_NAME }}:latest .
          echo "✅ Docker image built successfully"

      - name: Push Docker Image to ACR
        run: |
          docker push ${{ env.ACR_REGISTRY }}/${{ env.AZURE_WEBAPP_NAME }}:${{ env.ACR_IMAGE_TAG }}
          docker push ${{ env.ACR_REGISTRY }}/${{ env.AZURE_WEBAPP_NAME }}:latest
          echo "✅ Image pushed to ACR successfully"

      - name: Deploy to Azure Web App (Frontend)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: "${{ env.ACR_REGISTRY }}/${{ env.AZURE_WEBAPP_NAME }}:${{ env.ACR_IMAGE_TAG }}"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Deployment Info
        run: |
          echo "✅ Frontend deployed successfully!"
          echo "🌐 URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

  # JOB 3: Health Check
  health-check:
    name: Application Health Check
    runs-on: ubuntu-latest
    needs: build-push-deploy
    if: always()
    continue-on-error: true
    steps:
      - name: Wait for initial deployment
        run: |
          echo "⏳ Waiting for Azure deployment to propagate (90 seconds)..."
          sleep 90

      - name: Check frontend health (with extended retry)
        run: |
          echo "🔍 Checking frontend health..."
          MAX_RETRIES=8
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net)
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: HTTP Status $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "✅ Frontend is healthy (HTTP $HTTP_STATUS)"
              SUCCESS=true
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "⏳ Retrying in 20 seconds..."
              sleep 20
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "⚠️ Frontend health check failed after $MAX_RETRIES attempts"
            echo "💡 Azure deployment might still be propagating. Check manually at:"
            echo "   https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          fi

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "FRONTEND DEPLOYMENT COMPLETED"
          echo "=========================================="
          echo "App Name: ${{ env.AZURE_WEBAPP_NAME }}"
          echo "Registry: ${{ env.ACR_REGISTRY }}"
          echo "Image Tag: ${{ env.ACR_IMAGE_TAG }}"
          echo "URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "=========================================="
