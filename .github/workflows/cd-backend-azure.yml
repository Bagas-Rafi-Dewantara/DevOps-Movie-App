name: CD - Backend Production (Azure)

on:
  push:
    branches: [master]
    paths:
      - "server/**" # Hanya trigger jika ada perubahan DI DALAM folder server
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: "movie-app-backend-pso"
  BACKEND_ACR_REGISTRY: "movieapp.azurecr.io"
  ACR_IMAGE_TAG: "latest"

jobs:
  # JOB 1: Validation
  validate-prerequisites:
    name: Validate Prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Environment Variables
        run: |
          if [ -z "${{ secrets.BACKEND_ACR_USERNAME }}" ]; then
            echo "❌ Error: BACKEND_ACR_USERNAME secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.BACKEND_ACR_PASSWORD }}" ]; then
            echo "❌ Error: BACKEND_ACR_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.BACKEND_AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "❌ Error: BACKEND_AZURE_WEBAPP_PUBLISH_PROFILE secret is not set"
            exit 1
          fi
          echo "✅ All prerequisites validated successfully"

      - name: Check Backend Files
        run: |
          if [ ! -f "server/package.json" ]; then
            echo "❌ Error: server/package.json not found"
            exit 1
          fi
          if [ ! -f "server/Dockerfile" ]; then
            echo "❌ Error: server/Dockerfile not found"
            exit 1
          fi
          echo "✅ Backend files validated"

  # JOB 2: Build, Push & Deploy
  build-push-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: validate-prerequisites
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to ACR (Backend)
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.BACKEND_ACR_REGISTRY }}
          username: ${{ secrets.BACKEND_ACR_USERNAME }}
          password: ${{ secrets.BACKEND_ACR_PASSWORD }}

      - name: Build Docker Image (Backend)
        run: |
          cd server
          docker build \
            -t ${{ env.BACKEND_ACR_REGISTRY }}/${{ env.AZURE_WEBAPP_NAME }}:${{ env.ACR_IMAGE_TAG }} \
            -t ${{ env.BACKEND_ACR_REGISTRY }}/${{ env.AZURE_WEBAPP_NAME }}:latest .
          echo "✅ Docker image built successfully"

      - name: Push Docker Image to ACR
        run: |
          docker push ${{ env.BACKEND_ACR_REGISTRY }}/${{ env.AZURE_WEBAPP_NAME }}:${{ env.ACR_IMAGE_TAG }}
          docker push ${{ env.BACKEND_ACR_REGISTRY }}/${{ env.AZURE_WEBAPP_NAME }}:latest
          echo "✅ Image pushed to ACR successfully"

      - name: Deploy to Azure Web App (Backend)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: "${{ env.BACKEND_ACR_REGISTRY }}/${{ env.AZURE_WEBAPP_NAME }}:${{ env.ACR_IMAGE_TAG }}"
          publish-profile: ${{ secrets.BACKEND_AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Deployment Info
        run: |
          echo "✅ Backend deployed successfully!"
          echo "🌐 URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

  # JOB 3: Health Check
  health-check:
    name: Application Health Check
    runs-on: ubuntu-latest
    needs: build-push-deploy
    if: always()
    continue-on-error: true
    steps:
      - name: Wait for initial deployment
        run: |
          echo "⏳ Waiting for Azure deployment to propagate (90 seconds)..."
          sleep 90

      - name: Check backend health (with extended retry)
        run: |
          echo "🔍 Checking backend health..."
          MAX_RETRIES=8
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net)
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: HTTP Status $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "✅ Backend is healthy (HTTP $HTTP_STATUS)"
              SUCCESS=true
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "⏳ Retrying in 20 seconds..."
              sleep 20
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "⚠️ Backend health check failed after $MAX_RETRIES attempts"
            echo "💡 Azure deployment might still be propagating. Check manually at:"
            echo "   https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          fi

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "BACKEND DEPLOYMENT COMPLETED"
          echo "=========================================="
          echo "App Name: ${{ env.AZURE_WEBAPP_NAME }}"
          echo "Registry: ${{ env.BACKEND_ACR_REGISTRY }}"
          echo "Image Tag: ${{ env.ACR_IMAGE_TAG }}"
          echo "URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "=========================================="
